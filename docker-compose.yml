services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - DOTNET_Environment=Development
      - ASPNETCORE_URLS=http://+:80
      - Mongo__ConnectionString=mongodb://mongo:27017
      - Mongo__DatabaseName=InventoryHold
      - Redis__ConnectionString=redis:6379
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
    depends_on:
      - mongo
      - redis
      - rabbitmq
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"
      - "15672:15672"
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
volumes:
  mongo-data:
